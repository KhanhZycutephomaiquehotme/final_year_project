<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/LoaiTrucTiep.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <link href="./vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./vendor/bootstrap/icon/bootstrap-icons.min.css">
    <script src="./vendor/jquery/jquery-4.0.0.min.js"></script>
    <script src="./vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="./vendor/select2/css/select2.min.css">
    <script src="./vendor/select2/js/select2.min.js"></script>
</head>

<body>
    <div id="bracket">

        <svg id="bracket-line"></svg>

        <div id="bracket-content"></div>

    </div>
    <div id="list-team"></div>

    <div class="modal fade" id="settingMatch" data-bs-focus="false" tabindex="-1" aria-labelledby="settingMatchLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="settingMatchLabel">Thiết lập trận đấu</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <ul class="nav nav-fill nav-tabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <a class="nav-link active" id="fill-tab-0" data-bs-toggle="tab" href="#fill-tabpanel-0" role="tab" aria-controls="fill-tabpanel-0" aria-selected="true">THÔNG TIN TRẬN ĐẤU</a>
                    </li>
                    <li class="nav-item" role="presentation">
                        <a class="nav-link" id="fill-tab-1" data-bs-toggle="tab" href="#fill-tabpanel-1" role="tab" aria-controls="fill-tabpanel-1" aria-selected="false">ĐỘI HÌNH RA SÂN</a>
                    </li>
                    <li class="nav-item" role="presentation">
                        <a class="nav-link" id="fill-tab-2" data-bs-toggle="tab" href="#fill-tabpanel-2" role="tab" aria-controls="fill-tabpanel-2" aria-selected="false">DIỄN BIẾN CHÍNH</a>
                    </li>
                </ul>
                <div class="tab-content pt-5" id="tab-content">

                <!-- TAB THÔNG TIN TRẬN ĐẤU -->
                <div class="tab-pane active" id="fill-tabpanel-0">
                    <form>
                        <div class="form-group mb-3">
                            <label for="selectFootballField" class="mb-2">Chọn sân đấu</label>
                            <select class="form-select form-control" id="selectFootballField" aria-label="Default select example" data-placeholder="Chọn sân đấu">
                                <option></option>
                            </select>
                        </div>
                        <div class="form-group mb-3">
                            <label for="selectReferee" class="mb-2">Chọn trọng tài</label>
                            <select class="form-select form-control" id="selectReferee" aria-label="Default select example" data-placeholder="Chọn trọng tài">
                                <option></option>
                            </select>
                        </div>
                        <div class="form-group mb-3">
                            <label for="matchTime" class="mb-2">Chọn thời gian diễn tra trận đấu</label>
                            <input type="datetime-local" class="form-control" id="matchTime">
                        </div>
                        <div class="form-group mb-3 row">
                            <div class="col-6">
                                <label class="mb-2">Thiết lập tỉ số trận đấu</label>
                                <div>
                                    <div class="form-check">
                                        <input class="form-check-input " type="radio" name="radioSettingMatchScore" id="radioSettingMatchScore1" checked>
                                        <label class="form-check-label" for="radioSettingMatchScore1">
                                            Tự thiết lập
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="radioSettingMatchScore" id="radioSettingMatchScore2">
                                        <label class="form-check-label" for="radioSettingMatchScore2">
                                            Thiết lập theo diễn biến trận đấu
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <div class="col-6 border-start">
                                <label for="selectReferee" class="mb-2">Tỉ số</label>
                                <div class="d-flex align-items-center">
                                    <div class="w-25 me-2"><label for="score1">Đội 1</label></div>
                                    <span class="mx-2">&nbsp;</span>
                                    <div class="w-25 ms-2"><label for="score2">Đội 2</label></div>
                                </div>
                                <div class="d-flex align-items-center">
                                    <input type="number" class="form-control w-25 me-2" id="scoreTeam1" placeholder="0">
                                    <span class="mx-2">-</span>
                                    <input type="number" class="form-control w-25 ms-2" id="scoreTeam2" placeholder="0">
                                </div>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- TAB THIẾT LẬP CẦU THỦ RA SÂN -->
                <div class="tab-pane" id="fill-tabpanel-1">
                    <div class="row">
                        <div class="col-8" id="football-field">

                            <!-- HỈNH ẢNH SÂN BÓNG -->
                            <svg class="football-svg"
                                xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 74 111"
                                preserveAspectRatio="xMidYMid meet">

                                <rect width="74" height="111" fill="#7dc891"/>

                                <g fill="none" stroke="#fff" stroke-width="0.5" transform="translate(3 3)">
                                    <path d="M 0 0 h 68 v 105 h -68 Z"/>
                                    <path d="M 0 52.5 h 68"/>
                                    <circle r="9.15" cx="34" cy="52.5"/>
                                    <circle r="0.75" cx="34" cy="52.5" fill="#fff" stroke="none"/>

                                    <g id="PenaltyArea">
                                        <path d="M 13.84 0 v 16.5 h 40.32 v -16.5"/>
                                        <path d="M 24.84 0 v 5.5 h 18.32 v -5.5"/>
                                        <circle r="0.75" cx="34" cy="10.94" fill="#fff" stroke="none"/>
                                        <path d="M 26.733027 16.5 a 9.15 9.15 0 0 0 14.533946 0"/>
                                    </g>

                                    <use xlink:href="#PenaltyArea" transform="rotate(180,34,52.5)" />

                                    <path d="M 0 2 a 2 2 0 0 0 2 -2
                                            M 66 0 a 2 2 0 0 0 2 2
                                            M 68 103 a 2 2 0 0 0 -2 2
                                            M 2 105 a 2 2 0 0 0 -2 -2"/>
                                </g>

                            </svg>

                            <!-- LƯỚI CẦU THỦ TRÊN SÂN (SLOT PLAYER) -->
                            <div class="football-overlay" id="football-overlay">

                            </div>
                        </div>

                        <!-- DANH SÁCH CẦU THỦ CỦA TỪNG ĐỘI BÓNG (CHỈ BAO GÒM CHƯA RA SẤN, RA SÂN RỒI THÌ SẼ CÓ TRÊN element id football-overlay) -->
                        <div class="col-4">
                            <div class="col-12 h-100" id="player-list">
                                <div id="team1" class="h-50">
                                    <div class="title-team-name" id="team1-name">TÊN ĐỘI 1</div>
                                    <div class="h-75 overflow-scroll">
                                        <div id="list-player-in-team1" class="me-0 row player-in-list">
                                        
                                        </div>
                                    </div>
                                </div>
                                <div id="team2" class="row h-50">
                                    <div class="title-team-name" id="team2-name">TÊN ĐỘI 2</div>
                                    <div class="h-75 overflow-scroll">
                                        <div id="list-player-in-team2" class="me-0 row player-in-list">
    
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <!-- THIẾT LẬP DIỄN BIẾN TRẬN ĐẤU -->
                <div class="tab-pane" id="fill-tabpanel-2">
                    <div class="match-flow-body">
                        <div id="match-flow-lock" class="match-flow-lock">
                            <div class="match-flow-lock-content">
                                <div class="match-flow-lock-icon">
                                    ⚽
                                </div>

                                <div class="match-flow-lock-title">
                                    Bật Thiết lập tỉ số theo diễn biến trận đấu
                                </div>

                                <button
                                    type="button"
                                    id="btn-enable-match-flow"
                                    class="btn btn-primary mt-3"
                                >
                                    Bật thiết lập
                                </button>
                            </div>
                        </div>
                        <div id="match-flow-container-demo">
                            <div class="d-flex flex-column p-3" id="match-flow-demo">

                            </div>
                        </div>
                        <div id="match-flow-container">
                            <div class="float-end">
                                <button type="button" class="btn btn-success" data-bs-toggle="offcanvas" data-bs-target="#eventFormPanel">Thêm mới</button>
                            </div>
                            <div class="offcanvas offcanvas-end" tabindex="-1" id="eventFormPanel">
                                <div class="offcanvas-header">
                                    <h5 class="offcanvas-title">Thêm sự kiện</h5>

                                    <button type="button" class="btn-close"data-bs-dismiss="offcanvas"></button>
                                </div>

                                <div class="offcanvas-body">

                                    <div class="mb-3">
                                        <label class="form-label">Loại sự kiện</label>

                                        <select class="form-select">
                                            <option>⚽ Bàn thắng</option>
                                            <option>🟨 Thẻ vàng</option>
                                            <option>🟥 Thẻ đỏ</option>
                                            <option>🔄 Thay người</option>
                                        </select>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Thời gian</label>

                                        <input type="number" class="form-control"  placeholder="Phút">
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Đội</label>

                                        <select class="form-select">
                                            <option>Đội #1</option>
                                            <option>Đội #2</option>
                                        </select>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label">Cầu thủ</label>

                                        <select class="form-select">
                                            <option>Thái Văn Lung</option>
                                            <option>Hậu Tạ</option>
                                        </select>
                                    </div>

                                    <div class="d-flex justify-content-end gap-2">
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas">Hủy</button>
                                        <button type="button" class="btn btn-primary">Thêm sự kiện</button>
                                    </div>

                                </div>
                            </div>
                            <div class="d-flex flex-column p-3" id="match-flow-list">
                            </div>
                        </div>
                    </div>
                </div>

            </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                <button type="button" class="btn btn-primary" id="saveSettingMatch">Lưu</button>
            </div>
            </div>
        </div>
    </div>
    

</body>
<script src="./js/pages/LoaiTrucTiep/data.js"></script>
<script src="./js/pages/LoaiTrucTiep/script.js"></script>
<script src="./js/pages/LoaiTrucTiep/matchDetail/formation.js"></script> 
<script src="./js/pages/LoaiTrucTiep/match_detail.js"></script> 
<script src="./js/pages/LoaiTrucTiep/bracket.js"></script>
</html>
